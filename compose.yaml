name: aiops-assistant

services:
  assistant:
    build: .
    environment:
      OPS_API_TOKENS: ${OPS_API_TOKENS:-}
      OPS_APPROVER_IDENTITIES: ${OPS_APPROVER_IDENTITIES:-["admin"]}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_INSTANCE: node-exporter:9100
      OPS_PROMETHEUS_TARGET_MODE: managed
      OPS_PROMETHEUS_TARGET_FILE: /app/prometheus-targets/assistant.yml
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      # 管理员配置页在 /app/config 原目录原子替换 YAML；备份写入 /app/data。
      - ./config:/app/config:rw
      - ./.runtime/assistant-data:/app/data
      - ./.runtime/assistant-logs:/app/logs
      - ./.runtime/prometheus-targets:/app/prometheus-targets:rw
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - ./.runtime/prometheus-targets:/etc/prometheus/assistant-targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - ./.runtime/secrets:/run/secrets:ro
      - alertmanager-data:/alertmanager
    depends_on: [assistant]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--collector.textfile.directory=/textfile"]
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - ./.runtime/textfile:/textfile:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
