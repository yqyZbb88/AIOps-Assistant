name: aiops-assistant

x-app: &app
  image: ${AIOPS_IMAGE:-aiops-assistant:local}
  build: .

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  init:
    <<: *app
    entrypoint: ["python", "scripts/deployment.py"]
    command: ["init"]
    healthcheck:
      disable: true
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-}
      OPS_REDACTION_SECRETS: ${OPS_REDACTION_SECRETS:-}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-}
      SSH_USER: ${SSH_USER:-}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      SSH_KEY_FILENAME: ${SSH_KEY_FILENAME:-}
      SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS:-}
    volumes:
      - ${AIOPS_RUNTIME_DIR:-./.runtime}:/runtime
    restart: "no"
    logging: *logging

  assistant:
    <<: *app
    entrypoint: ["python", "scripts/deployment.py"]
    command: ["serve"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_INSTANCE: node-exporter:9100
      OPS_PROMETHEUS_TARGET_MODE: managed
      OPS_PROMETHEUS_TARGET_FILE: /app/prometheus-targets/assistant.yml
    ports: ["127.0.0.1:${ASSISTANT_HOST_PORT:-8000}:8000"]
    volumes:
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/config:/app/config:rw
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/assistant-data:/app/data
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/assistant-logs:/app/logs
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/prometheus-targets:/app/prometheus-targets:rw
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/secrets:/run/assistant-secrets:ro
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/ssh:/run/ssh:ro
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.13.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/prometheus-targets:/etc/aiops-targets:ro
      - prometheus-data:/prometheus
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/alertmanager:/run/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager
    depends_on:
      assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--collector.textfile.directory=/textfile"]
    ports: ["127.0.0.1:${NODE_EXPORTER_HOST_PORT:-9100}:9100"]
    volumes:
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/textfile:/textfile:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/grafana-secrets/admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/grafana-secrets/admin_password
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${AIOPS_RUNTIME_DIR:-./.runtime}/grafana:/run/grafana-secrets:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
