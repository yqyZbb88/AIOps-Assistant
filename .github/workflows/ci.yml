name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated regression image
        run: docker build --target test -t aiops-regression:ci .
      - name: Compile container sources and check frontend syntax
        run: |
          docker run --rm --network none --entrypoint python aiops-regression:ci -m compileall -q src scripts tests
          docker run --rm --network none --entrypoint node aiops-regression:ci --check src/web/console.js
          docker run --rm --network none --entrypoint node aiops-regression:ci --check src/web/markdown.js
          git diff --check
      - name: Offline regression in container
        run: docker run --rm --network none aiops-regression:ci

  deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: aiops-ci
      AIOPS_RUNTIME_DIR: ./.pytest_tmp_compose
      MODEL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build and wait for healthy services
        run: docker compose --env-file .env.example up -d --build --wait --wait-timeout 180
      - name: Validate explicit legacy migration in stopped isolated stack
        run: |
          docker compose --env-file .env.example down
          mkdir -p .pytest_tmp_migration_project
          docker compose --env-file .env.example run --rm --no-deps -T -v "$PWD/tests:/app/tests:ro" -v "$PWD/.pytest_tmp_migration_project:/migration-project" --entrypoint python init -m tests.compose_migration_smoke --seed
          docker compose --env-file .env.example run --rm --no-deps -T -v "$PWD/.pytest_tmp_migration_project:/migration-project" init migrate-config --dry-run
          docker compose --env-file .env.example run --rm --no-deps -T -v "$PWD/.pytest_tmp_migration_project:/migration-project" init migrate-config
          docker compose --env-file .env.example run --rm --no-deps -T -v "$PWD/.pytest_tmp_migration_project:/migration-project" init migrate-config
          docker compose --env-file .env.example run --rm --no-deps -T -v "$PWD/tests:/app/tests:ro" -v "$PWD/.pytest_tmp_migration_project:/migration-project" --entrypoint python init -m tests.compose_migration_smoke
          docker compose --env-file .env.example up -d --wait --wait-timeout 180
      - name: Validate all metric expressions with real Prometheus engine
        run: |
          docker compose --env-file .env.example exec -T assistant python - /app/data/metrics-promtool.yml < tests/prometheus_acceptance.py
          docker compose --env-file .env.example exec -T prometheus promtool test rules /dev/stdin < .pytest_tmp_compose/assistant-data/metrics-promtool.yml
      - name: Validate host alert labels with real Prometheus engine
        run: |
          docker compose --env-file .env.example exec -T assistant python - /app/data/alerts-promtool.yml < tests/prometheus_alert_acceptance.py
          docker compose --env-file .env.example exec -T prometheus promtool test rules /dev/stdin < .pytest_tmp_compose/assistant-data/alerts-promtool.yml
      - name: Check two-user session isolation and host access
        run: docker compose --env-file .env.example exec -T assistant python - < tests/compose_access_smoke.py
      - name: Check fresh deployment and real webhook delivery
        run: docker compose --env-file .env.example exec -T assistant python - < tests/compose_smoke.py
      - name: Recreate without losing state
        run: docker compose --env-file .env.example up -d --force-recreate --wait --wait-timeout 180
      - name: Check credentials, configuration and SQLite persistence
        run: docker compose --env-file .env.example exec -T assistant python - --verify < tests/compose_smoke.py
      - name: Check host access and private sessions after recreation
        run: docker compose --env-file .env.example exec -T assistant python - --verify < tests/compose_access_smoke.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps --all
          docker compose --env-file .env.example logs --tail 100
      - name: Remove isolated CI stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
