# Agent 写命令白名单，所有调用都必须人工审批。
# 与 rules.yaml 的自动处置命令相互独立。
# enabled=false 时不向 Agent 提供任何写工具。
# approval 只有超时和容量配置，不存在关闭审批的开关。
# 连接凭据只从环境变量读取；修改后需要重启服务。

enabled: false

target:
  host: "${SSH_HOST:-localhost}"
  port: 22                  # 必须 >= 1
  username: "${SSH_USER:-ops}"
  key_filename: "${SSH_KEY_FILENAME:-}"
  password: "${SSH_PASSWORD:-}"
  known_hosts: "${SSH_KNOWN_HOSTS:-}"  # 留空时使用系统 known_hosts
  connect_timeout: 8       # SSH 连接与命令超时秒数，必须 >= 1

output_limit: 4000  # 返回 Agent 的字符上限；当前底层仍会先完整读取 SSH 输出

approval:
  timeout_seconds: 900  # 待审批项有效期
  max_pending: 32       # 最大待审批数量

commands:
  restart_service:
    summary: 重启一个 systemd 服务（会中断该服务）
    template: "systemctl restart {service}"
    sudo: true
    params:
      service:
        type: str
        pattern: "^[A-Za-z0-9_.:@-]{1,128}$"
        description: 服务名，如 nginx / mysql

  cleanup_disk:
    summary: 执行目标主机上的磁盘清理脚本
    template: "cd /opt/ops && bash cleanup_disk.sh"
    sudo: false
    params: {}
