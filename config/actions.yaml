# 规则自动处置的写命令白名单。
# 命令模板只能写在这里；rules.yaml 只引用 key。
# 本路径没有人工审批；只有 rules.yaml 中 auto_execute=true 的规则才真正执行。
# 模板是管理员可信配置，字符串参数必须提供全匹配正则，整数参数应提供 min/max。
# 管理页保存后热生效；手动编辑后需由管理员显式应用磁盘配置。

enabled: true
output_limit: 4000            # SSH channel 最多保留的输出字符数；超出部分排空但不驻留内存

commands:
  restart_service:
    summary: 重启一个 systemd 服务
    template: "systemctl restart {service}"
    sudo: true
    params:
      service:
        type: str
        pattern: "^[A-Za-z0-9_.:@-]{1,128}$"
        description: 服务名，如 nginx / mysql

  cleanup_disk:
    summary: 执行目标主机上的磁盘清理脚本
    template: "cd /opt/ops && bash cleanup_disk.sh"
    sudo: false
    params: {}
