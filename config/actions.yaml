# 规则自动处置的写命令白名单。
# 命令模板只能写在这里；rules.yaml 只引用 key。
# 修改后需要重启服务。

enabled: true

commands:
  restart_service:
    summary: 重启一个 systemd 服务
    template: "systemctl restart {service}"
    sudo: true
    params:
      service:
        type: str
        pattern: "^[A-Za-z0-9_.:@-]{1,128}$"
        description: 服务名，如 nginx / mysql

  cleanup_disk:
    summary: 执行目标主机上的磁盘清理脚本
    template: "cd /opt/ops && bash cleanup_disk.sh"
    sudo: false
    params: {}
