# 统一指标配置。
# 查询表达式由程序内置维护；此文件只配置启用范围、阈值、实例和 selector。
# 修改后需要重启服务。

version: 1
instance: ${PROMETHEUS_INSTANCE:-localhost:9100}  # 默认监控实例，可用环境变量覆盖
max_alert_analysis_metrics: 8                     # 告警 AI 单次最多分析的指标数

metrics:
  # 核心指标：参与巡检、聊天工具和告警分析。
  cpu.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 80
    critical: 90
    severity_enabled: true

  memory.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 85
    critical: 95
    severity_enabled: true

  disk.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 80
    critical: 90
    severity_enabled: true

  # 增强巡检指标：先观察，确认基线后再开启阈值。
  cpu.load1:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  cpu.iowait:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  memory.available:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  memory.swap_usage:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.read_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.write_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.io_util:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.rx_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.tx_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.rx_errors:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.tx_errors:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  system.process_count:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  system.uptime:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  # 活动告警数：参与巡检和聊天。
  alerts.active_count:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: false }
    warning: 1
    critical: 3
    severity_enabled: true
