# 统一指标运行配置
#
# PromQL / 指标类型 / 分组方式在代码指标目录中维护，本文件只负责：
#   enabled         是否启用
#   surfaces        用于巡检 / 聊天工具 / 告警 AI 趋势
#   warning critical severity_enabled
#   selector        可选 Prometheus 标签 matcher，覆盖全局 instance 或增加过滤
#
# 修改后需要重启服务。未知指标 ID、未知字段、非法阈值会让服务拒绝启动。

version: 1
instance: 192.168.20.128:9100
max_alert_analysis_metrics: 8

metrics:
  cpu.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 80
    critical: 90
    severity_enabled: true

  cpu.load1:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  cpu.iowait:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  memory.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 85
    critical: 95
    severity_enabled: true

  memory.available:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  memory.swap_usage:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.usage:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: true }
    warning: 80
    critical: 90
    severity_enabled: true

  disk.read_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.write_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  disk.io_util:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.rx_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.tx_bytes:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.rx_errors:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  network.tx_errors:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  system.process_count:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  system.uptime:
    enabled: true
    surfaces: { inspection: true, chat: false, alert_analysis: false }
    severity_enabled: false

  alerts.active_count:
    enabled: true
    surfaces: { inspection: true, chat: true, alert_analysis: false }
    warning: 1
    critical: 3
    severity_enabled: true
