# Alertmanager alertname 到写命令的规则映射。
# 命中规则的告警不会进入 AI 分析；默认全部不自动执行。
# 启用 auto_execute 前，必须确认 target_instance 和 SSH 凭据。

rules:
  - alertname: HighCPUUsage
    action: restart_service
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
      service: nginx
    auto_execute: false
    description: "CPU 持续过高时重启 nginx（默认人工确认后启用）"

  - alertname: HighMemoryUsage
    action: restart_service
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
      service: mysql
    auto_execute: false
    description: "内存持续过高时重启 mysql（默认人工确认后启用）"

  - alertname: HighDiskUsage
    action: cleanup_disk
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
    auto_execute: false
    description: "磁盘过高时执行清理脚本（默认人工确认后启用）"
