# Alertmanager alertname 到写命令的规则映射。
# 规则只按 alertname 精确匹配；即使 auto_execute=false，命中后也不会进入 AI 分析。
# rules.yaml 只引用 actions.yaml 的命令 key，不允许传入自由命令。
# 启用 auto_execute 前，必须确认 target_instance、SSH 凭据和命令影响范围。
# 管理页保存后热生效；手动编辑后需由管理员显式应用磁盘配置。

auto_execute_enabled: false

rules:
  - alertname: HighCPUUsage
    action: restart_service
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
      service: nginx
    auto_execute: false
    description: "CPU 持续过高时重启 nginx（默认关闭自动执行）"

    id: rule_17454358d946
    enabled: true
  - alertname: HighMemoryUsage
    action: restart_service
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
      service: mysql
    auto_execute: false
    description: "内存持续过高时重启 mysql（默认关闭自动执行）"

    id: rule_461eb97ab5b7
    enabled: true
  - alertname: HighDiskUsage
    action: cleanup_disk
    target_instance: "${PROMETHEUS_INSTANCE:-localhost:9100}"
    params:
      host: "${SSH_HOST:-localhost}"
      port: "${SSH_PORT:-22}"
      username: "${SSH_USER:-ops}"
      password: "${SSH_PASSWORD:-}"
      key_filename: "${SSH_KEY_FILENAME:-}"
      known_hosts: "${SSH_KNOWN_HOSTS:-}"
    auto_execute: false
    description: "磁盘过高时执行清理脚本（默认关闭自动执行）"
    id: rule_cdeb3f4893c6
    enabled: true
