# ops-agent 全局配置（重构后统一入口）
#
# 取值方式：
#   - 可变参数集中在这里，代码不硬编码；
#   - 敏感值一律用环境变量占位并在加载时插值（机制见 utils/config_loader.py），
#     真实值写入根目录 .env（勿提交版本库），config/ 下不落任何明文密钥。

app:
  name: ops-agent          # 应用标识（FastAPI title / 日志 logger 前缀）
  version: 0.2.0           # 语义化版本（本次架构重构后递增）

server:
  host: 127.0.0.1          # 仅本机可访问；局域网开放请改 0.0.0.0
  port: 8000

prometheus:
  # 数据源地址：优先取环境变量 PROMETHEUS_URL，缺省回退 localhost:9090
  base_url: ${PROMETHEUS_URL:-http://localhost:9090}
  timeout: 5               # 查询超时（秒），避免 Prometheus 异常时长时间阻塞

monitor:
  provider: prometheus     # 监控源插件名（registry 中 monitors 已注册的名称）

llm:
  provider: deepseek       # LLM 插件名（registry 中 llms 已注册的名称）
  enabled: true            # false 时告警 AI 分析直接跳过，不阻塞告警接收

agent:
  name: ops_assistant      # Agent trace/日志归因名（预留，聊天 Agent 构建用）
  debug: false             # create_agent 的 debug 开关（预留）

alert:
  recent_limit: 100        # 最近告警内存缓冲上限（条）
  trend_minutes: 60        # 告警 AI 分析时取的实例历史趋势窗口（分钟）
  trend_step: "5m"         # 趋势采点步长

storage:
  # SQLite 持久化总开关。关闭 / 打不开（磁盘满、无写权限、文件版本过新）
  # → 服务照常启动，只是退化回「不落盘」：会话、告警归档、AI 建议均不保存。
  # 注意：代码里的 dataclass 默认值是 false，本文件的 true 才是「出厂打开」。
  enabled: true
  db_path: "data/ops_agent.db"   # 相对仓库根；WAL 会在同目录生成 -wal / -shm 两个旁文件
  session_ttl_hours: 72          # 会话过期时长（小时），过期连同其消息一并清理
  max_sessions: 200              # 会话数上限，超出按最旧淘汰
  message_window: 20             # 每轮重发给模型的历史消息条数上限（限 token）
  history_ttl_hours: 168         # 告警 / 处置 / AI 建议归档的过期时长（小时）
  max_history_rows: 5000         # 上述三张归档表各自的行数上限
  purge_interval_seconds: 60     # 清理节流间隔（秒），避免每次写都全表扫

logging:
  level: INFO              # 日志级别（DEBUG / INFO / WARNING / ERROR）
  audit: true              # 是否启用动作审计日志（ops_agent.audit）
  audit_file: "logs/audit.log"   # 审计落盘路径（相对仓库根）；留空 = 只进 console
  audit_max_bytes: 5242880       # 单个文件上限（5 MiB），超出轮转
  audit_backup_count: 3          # 保留的轮转份数（audit.log.1 / .2 / .3）
