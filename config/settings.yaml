# AIOps-Assistant 全局配置。
# 管理页可编辑字段保存后热生效；监听/存储/日志路径与环境密钥仍需重启。

app:
  name: AIOps-Assistant          # 应用名称，用于 API 文档和日志

server:
  host: 127.0.0.1          # 仅 python src/main.py 使用；uvicorn 命令行参数会覆盖
  port: 8000               # 默认仅监听本机；开放 0.0.0.0 前必须启用鉴权

prometheus:
  base_url: ${PROMETHEUS_URL:-http://localhost:9090}
  timeout: 5               # 查询超时秒数
  target_mode: ${OPS_PROMETHEUS_TARGET_MODE:-external} # external 只登记已发现目标；managed 使用文件发现
  file_sd_path: '${OPS_PROMETHEUS_TARGET_FILE:-}' # 自管模式下 Assistant 可写的目标文件

monitor:
  provider: prometheus     # 当前注册的监控源插件

llm:
  provider: deepseek
  enabled: true            # 控制告警 AI 分析；聊天 Agent 由 agent.enabled 单独控制

agent:
  enabled: true            # false 时聊天只走关键词兜底
  name: ops_assistant
  debug: false
  recursion_limit: 25      # 单轮 Agent 最大工具调用步骤

chat:
  max_message_chars: 8000  # POST /chat 单条消息字符上限，超过返回 413

metrics:
  file: config/metrics.yaml  # 空字符串表示使用代码内置默认配置

hosts:
  file: config/hosts.yaml    # 空字符串启用旧单主机兼容方式；清单手改后由管理员显式应用

alert:
  recent_limit: 100        # 内存中保留的最近告警数
  trend_minutes: 60        # 告警分析趋势窗口
  trend_step: "5m"         # 趋势查询步长

inspection:
  enabled: true
  interval_seconds: 300    # 每 5 分钟巡检一次
  run_on_start: true
  ttl_hours: 168           # 异常巡检保留 7 天
  max_rows: 2500           # 异常巡检最大记录数，可覆盖约 7 天
  max_hosts_per_run: 50    # 单轮最多巡检主机数，超过时轮转
  max_queries_per_run: 500 # 单轮查询预算，防止主机数×指标数失控
  round_timeout_seconds: 120 # 到时在主机边界停止，下一轮续接

storage:
  enabled: true             # false 时不持久化；聊天仍可无状态运行
  db_path: "data/aiops_assistant.db"
  session_ttl_hours: 72     # 会话按最后活动时间过期
  max_sessions: 200         # 超出时淘汰最旧会话
  message_window: 20        # 每轮最多发送给模型的 final 历史消息数
  history_ttl_hours: 168    # 告警、处置、建议、幂等和审批决策保留期
  max_history_rows: 5000    # 上述各类历史表各自的容量上限
  purge_interval_seconds: 60  # 惰性清理的最小触发间隔

logging:
  level: INFO               # DEBUG / INFO / WARNING / ERROR
  audit: true               # false 时只记录 WARNING 及以上，不等于完全关闭审计
  audit_file: "logs/audit.log"
  audit_max_bytes: 5242880
  audit_backup_count: 3
  inspection_file: "logs/inspection.log"
  inspection_max_bytes: 5242880
  inspection_backup_count: 3

auth:
  enabled: false            # true 且没有有效 tokens 时拒绝启动

  # 密钥到身份的 JSON 映射，启用鉴权时必须配置。
  tokens: '${OPS_API_TOKENS:-}'

  # owner：仅触发人可审批；approvers_only：列出的审批人可审批所有人的申请。
  approval_mode: approvers_only
  approver_identities: '["admin", "alice"]'

  # 最高权限管理员；只控制系统管理 API，不因关闭普通鉴权而绕过。
  admin_identities: '${OPS_ADMIN_IDENTITIES:-["admin"]}'

  # 只有该身份可以调用 POST /alert；留空会放宽为任何有效身份并产生 WARNING。
  alert_identity: alertmanager
