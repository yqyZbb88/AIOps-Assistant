# AIOps-Assistant 全局配置。密钥只写入 .env，不要写入本文件。

app:
  name: AIOps-Assistant          # 应用名称，用于 API 文档和日志

server:
  host: 127.0.0.1          # 默认只监听本机；对外服务建议使用反向代理
  port: 8000

prometheus:
  base_url: ${PROMETHEUS_URL:-http://localhost:9090}
  timeout: 5               # 查询超时秒数

monitor:
  provider: prometheus

llm:
  provider: deepseek
  enabled: true            # false 时跳过告警 AI 分析

agent:
  enabled: true            # false 时聊天只走关键词兜底
  name: ops_assistant
  debug: false
  recursion_limit: 25      # 单轮 Agent 最大工具调用步骤

chat:
  max_message_chars: 8000

metrics:
  file: config/metrics.yaml

alert:
  recent_limit: 100        # 内存中保留的最近告警数
  trend_minutes: 60        # 告警分析趋势窗口
  trend_step: "5m"         # 趋势查询步长

inspection:
  enabled: true
  interval_seconds: 300    # 每 5 分钟巡检一次
  run_on_start: true
  ttl_hours: 168           # 异常巡检保留 7 天
  max_rows: 2500           # 异常巡检最大记录数，可覆盖约 7 天

storage:
  enabled: true
  db_path: "data/aiops_assistant.db"
  session_ttl_hours: 72
  max_sessions: 200
  message_window: 20
  history_ttl_hours: 168
  max_history_rows: 5000
  purge_interval_seconds: 60

logging:
  level: INFO
  audit: true
  audit_file: "logs/audit.log"
  audit_max_bytes: 5242880
  audit_backup_count: 3
  inspection_file: "logs/inspection.log"
  inspection_max_bytes: 5242880
  inspection_backup_count: 3

auth:
  enabled: true

  # 密钥到身份的 JSON 映射，启用鉴权时必须配置。
  tokens: '${OPS_API_TOKENS:-}'

  # approvers_only：只有列出的身份可以批准写命令。
  approval_mode: approvers_only
  approver_identities: '${OPS_APPROVER_IDENTITIES:-["admin"]}'

  # 只有该身份可以调用 Alertmanager webhook。
  alert_identity: alertmanager
