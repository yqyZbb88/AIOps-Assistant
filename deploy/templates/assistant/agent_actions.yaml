# Compose 首次初始化模板；生效副本位于 .runtime/config/。
# Agent 写命令白名单，所有调用都必须人工审批。
# 与 rules.yaml 的自动处置命令相互独立。
# enabled=false 时不向 Agent 提供任何写工具。
# approval 只有超时和容量配置，不存在关闭审批的开关。
# 命令目录可热应用；连接信息来自已登记主机。

enabled: false


output_limit: 4000  # SSH channel 最多保留的输出字符数；超出部分排空但不驻留内存

approval:
  timeout_seconds: 900  # 待审批项有效期
  max_pending: 32       # 最大待审批数量

commands:
  restart_service:
    summary: 重启一个 systemd 服务（会中断该服务）
    template: "systemctl restart {service}"
    sudo: true
    params:
      service:
        type: str
        pattern: "^[A-Za-z0-9_.:@-]{1,128}$"
        description: 服务名，如 nginx / mysql

  cleanup_disk:
    summary: 执行目标主机上的磁盘清理脚本
    template: "cd /opt/ops && bash cleanup_disk.sh"
    sudo: false
    params: {}
