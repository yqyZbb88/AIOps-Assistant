global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: windows
    static_configs:
      - targets:
          - host.docker.internal:9182
  - job_name: node
    static_configs:
      - targets:
          - 192.168.20.131:9100
          - 192.168.20.132:9100
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  # 首次启用本配置需更新本地 Prometheus 容器；后续目标文件变更自动发现。
  - job_name: aiops-hosts
    file_sd_configs:
      - files:
          - /etc/aiops-targets/*.yml
        refresh_interval: 30s
