groups:
  - name: aiops-host
    rules:
      - alert: HighCPUUsage
        expr: |
          max by (instance) (100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
          or on (instance) aiops_demo_cpu_percent > 80
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "CPU 使用率持续高于 80%"
          description: "实例 {{ $labels.instance }} CPU 使用率过高。"

      - alert: HighMemoryUsage
        expr: |
          max by (instance) ((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) > 85
          or on (instance) aiops_demo_memory_percent > 85
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "内存使用率持续高于 85%"
          description: "实例 {{ $labels.instance }} 内存使用率过高。"

      - alert: HighDiskUsage
        expr: |
          max by (instance) ((1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100) > 85
          or on (instance) aiops_demo_disk_percent > 85
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "磁盘使用率持续高于 85%"
          description: "实例 {{ $labels.instance }} 磁盘使用率过高。"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Node Exporter 不可达"
          description: "实例 {{ $labels.instance }} 已连续 30 秒抓取失败。"
